<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermocracy — slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* The deck is themed per slide, never from prefers-color-scheme: a render must
   not depend on the OS the screenshot happened to be taken on. Dark cards open,
   close and carry the problem; the walkthrough runs light. */
.stage{
  --paper:#E7EDF0; --surface:#FFFFFF; --surface-2:#F3F7F9;
  --ink:#14242C; --muted:#5F737D; --line:#CDD9DF; --line-soft:#E1E9ED;
  --c-2:#2A6DB5; --c-1:#5FA3C4; --c0:#3B9B78; --c1:#DE9036; --c2:#C64C2C;
  --on-accent:#FFFFFF;
}
.stage[data-theme="dark"]{
  --paper:#101A1F; --surface:#17242B; --surface-2:#1D2D35;
  --ink:#E6EEF1; --muted:#93A6AF; --line:#2C3F49; --line-soft:#223139;
  --c-2:#5D9EE0; --c-1:#78BBD8; --c0:#56BC93; --c1:#E8A757; --c2:#E07152;
  --on-accent:#101A1F;
}
:root{--focus:#14242C}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#8A949A; color:#14242C;
  font-family:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.shell{max-width:1100px;margin:0 auto;padding:18px 16px 40px}

.stage{
  position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;
  background:var(--paper);border-radius:14px;overflow:hidden;
  box-shadow:0 6px 24px rgba(0,0,0,.28);
}
/* Every slide is rendered in its settled state — no timeline, no transitions —
   so a screenshot is never caught mid-animation. */
.stage *{transition:none!important;animation:none!important}

.scene{
  position:absolute;inset:0;padding:4.6cqw 4.6cqw 3.4cqw;
  display:flex;flex-direction:column;
}
.eyebrow{
  font-size:1.15cqw;font-weight:700;color:var(--c0);margin:0 0 .5cqw;
  text-transform:uppercase;letter-spacing:.14em;
}
.eyebrow.plain{color:var(--muted)}
h2.big{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:4.4cqw;letter-spacing:-.03em;line-height:1.04;margin:0 0 .4cqw;
  color:var(--ink);
}
.lead{font-size:1.85cqw;line-height:1.45;color:var(--muted);margin:.8cqw 0 0;max-width:52em}
/* `safe` matters: with plain `center`, a slide whose content is a few pixels
   too tall overflows in BOTH directions and paints over the title. Safe
   alignment falls back to flex-start rather than overflowing upward. */
.body{flex:1;display:flex;flex-direction:column;justify-content:safe center;min-height:0}
/* Sits outside the content column's right edge (4.6cqw of padding), so a slide
   whose column reaches the bottom can't collide with it. */
.pageno{
  position:absolute;right:1.7cqw;bottom:1.2cqw;
  font-size:1.05cqw;color:var(--muted);font-variant-numeric:tabular-nums;opacity:.75;
}

/* ---- title / close ---- */
.scene.hero{justify-content:center}
.hero .title{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:8.2cqw;letter-spacing:-.045em;line-height:.95;margin:0;color:var(--ink);
}
.hero .tagline{font-size:3cqw;color:var(--c-1);margin:1.4cqw 0 0}
.hero .bigramp{
  height:.85cqw;border-radius:99px;margin-top:4cqw;width:100%;
  background:linear-gradient(90deg,var(--c-2),var(--c-1) 26%,var(--c0) 50%,var(--c1) 74%,var(--c2));
}
.hero .ramplabels{display:flex;justify-content:space-between;font-size:1.15cqw;color:var(--muted);margin-top:.7cqw}
.hero .kicker{font-size:1.75cqw;color:var(--muted);margin:3cqw 0 0;max-width:46em}
.hero .kicker.strong{color:var(--ink)}
.hero .note{font-size:1.4cqw;color:var(--muted);margin:.8cqw 0 0}

/* ---- cards (three across) ---- */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.9cqw;margin-top:1.6cqw}
.card{
  background:var(--surface);border:.1cqw solid var(--line-soft);border-radius:1.2cqw;
  padding:1.9cqw;display:flex;flex-direction:column;
}
.card.accent{
  background:color-mix(in srgb,var(--c0) 12%,var(--surface));
  border:.17cqw solid var(--c0);
}
.disc{
  width:2.7cqw;height:2.7cqw;border-radius:50%;background:var(--ink);color:var(--paper);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.35cqw;
}
.card.accent .disc{background:var(--c0);color:var(--on-accent)}
.card h3,.cell h3{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:2cqw;
  letter-spacing:-.02em;margin:1.3cqw 0 .9cqw;color:var(--ink);line-height:1.15;
}
.card p,.cell p{font-size:1.45cqw;color:var(--muted);margin:0;line-height:1.5}
.cardsfoot{font-size:1.7cqw;font-style:italic;color:var(--c-1);margin:2cqw 0 0}

/* ---- duo (two people, one shared setpoint) ---- */
.scene.duo{justify-content:flex-start}
.duorow{display:grid;grid-template-columns:1fr auto 1fr;gap:2.6cqw;align-items:start;margin-top:2.6cqw}
.duop{display:flex;flex-direction:column;gap:.5cqw}
.duop .av{
  width:5.2cqw;height:5.2cqw;border-radius:50%;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:var(--paper);
}
.duop .av svg{width:56%;height:56%}
.duop .dtime{font-size:1.1cqw;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:.7cqw}
.duop .wn{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:2.5cqw;letter-spacing:-.02em;line-height:1.1;color:var(--ink);margin-top:.25cqw}
.duop .wr{font-size:1.3cqw;color:var(--muted);line-height:1.3}
.duoq{font-size:2.05cqw;line-height:1.4;margin:1.1cqw 0 0;letter-spacing:-.015em}
.duomid{display:flex;align-items:center;justify-content:center;padding-top:5.6cqw}
.setpoint{
  background:var(--surface-2);border:.1cqw solid var(--line-soft);
  border-radius:1cqw;padding:1.1cqw 1.8cqw;text-align:center;
}
.setpoint b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:2.8cqw;letter-spacing:-.03em;display:block;color:var(--ink)}
.setpoint span{font-size:1.05cqw;color:var(--muted)}
.duofoot{font-size:1.7cqw;font-weight:600;color:var(--ink);margin-top:2.6cqw}

/* ---- numbered rows ---- */
.rows{display:flex;flex-direction:column;gap:1.5cqw;margin-top:1.2cqw}
.row{display:flex;gap:1.4cqw;align-items:flex-start}
.row .disc{width:3.1cqw;height:3.1cqw;font-size:1.55cqw}
.row h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:2cqw;margin:.2cqw 0 .45cqw;letter-spacing:-.02em;color:var(--ink)}
.row p{font-size:1.5cqw;color:var(--muted);margin:0;line-height:1.45;max-width:54em}

/* ---- the vote panel ---- */
.split2{display:grid;grid-template-columns:1.15fr 1fr;gap:2.6cqw;align-items:start;margin-top:1.4cqw}
.split3{display:grid;grid-template-columns:.9fr .95fr 1.05fr;gap:2cqw;align-items:start;margin-top:1.4cqw}
.platenote{font-size:1.25cqw;color:var(--muted);margin:.8cqw 0 0}
.panel{background:var(--surface);border:.1cqw solid var(--line-soft);border-radius:1.2cqw;padding:1.8cqw}
.vbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:.6cqw}
.vbtn{
  background:var(--surface-2);border:.11cqw solid var(--line);border-radius:.85cqw;
  padding:.9cqw .2cqw .7cqw;text-align:center;
}
.vbtn .f{font-size:2.1cqw;line-height:1;display:block}
.vbtn .l{font-size:1.1cqw;color:var(--ink);display:block;margin-top:.4cqw}
.vbtn.on{border-color:var(--tint);border-width:.2cqw;background:color-mix(in srgb,var(--tint) 14%,var(--surface))}
.vbtn.on .l{color:var(--tint);font-weight:700}
.castline{font-size:1.35cqw;color:var(--muted);margin:1.5cqw 0 0}
.castnote{font-size:1.25cqw;font-style:italic;color:var(--c0);margin:.6cqw 0 0}
.points{display:flex;flex-direction:column;gap:1.5cqw;margin-top:.4cqw}
.point{display:flex;gap:.9cqw;font-size:1.5cqw;line-height:1.45;color:var(--ink)}
.point::before{
  content:"";width:.7cqw;height:.7cqw;border-radius:50%;background:var(--c0);
  flex:0 0 auto;margin-top:.55cqw;
}

/* ---- two-up screenshot pair ---- */
.shotwrap{display:grid;grid-template-columns:1fr 1fr;gap:2.2cqw;margin-top:1.8cqw;align-items:start}
.shotlab{
  font-size:1.2cqw;font-weight:700;color:var(--muted);margin:0 0 .8cqw;
  text-transform:uppercase;letter-spacing:.1em;
}
.shot .vbtns{margin-top:1.3cqw}

/* ---- dot plot + balance bar ---- */
.strip{position:relative}
.bands{display:grid;grid-template-columns:repeat(5,1fr);gap:.35cqw;height:7.4cqw;align-items:end}
.band{
  height:100%;display:flex;flex-direction:column-reverse;align-items:center;
  gap:.34cqw;padding-bottom:.34cqw;border-radius:.5cqw .5cqw 0 0;
  background:color-mix(in srgb,var(--tint) 10%,transparent);
}
.dot{width:1.25cqw;height:1.25cqw;border-radius:50%;background:var(--tint);flex:0 0 auto}
.axis{
  height:.42cqw;border-radius:99px;margin-top:.45cqw;
  background:linear-gradient(90deg,var(--c-2),var(--c-1) 26%,var(--c0) 50%,var(--c1) 74%,var(--c2));
}
.needle{position:absolute;bottom:-.7cqw;width:.24cqw;height:1.5cqw;border-radius:.2cqw;background:var(--ink)}
.needle.split{background:repeating-linear-gradient(to bottom,var(--ink) 0 .34cqw,transparent .34cqw .68cqw)}
.ticks{display:grid;grid-template-columns:repeat(5,1fr);gap:.35cqw;margin-top:1.2cqw;font-size:1.15cqw;color:var(--muted);text-align:center}

/* ---- one calm line in a busy list ---- */
.solorow{
  background:var(--surface);border:.1cqw solid var(--line-soft);border-radius:1.2cqw;
  padding:1.8cqw 2.2cqw;display:flex;align-items:center;justify-content:space-between;
  gap:2.4cqw;margin-top:2cqw;
}
.solorow .srname{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:2.6cqw;letter-spacing:-.02em;color:var(--ink);display:block}
.solorow .srmeta{font-size:1.5cqw;color:var(--muted);margin-top:.4cqw;display:block}
.solorow .srstrip{width:22cqw;flex:0 0 auto}
.caption{font-size:1.6cqw;color:var(--c-1);margin-top:2cqw}

/* ---- heat map ---- */
.hmwrap{display:grid;grid-template-columns:1.4fr 1fr;gap:2.4cqw;align-items:start;margin-top:1cqw}
.plate{
  position:relative;aspect-ratio:16/11;width:100%;
  background:var(--surface-2);border:.1cqw solid var(--line);
  border-radius:1cqw;overflow:hidden;
}
.plate .planart{position:absolute;inset:0;width:100%;height:100%}
.plate .planart .shellrect{fill:none;stroke:color-mix(in srgb,var(--ink) 55%,transparent);stroke-width:1.1}
.plate .planart .room{fill:color-mix(in srgb,var(--ink) 5%,transparent);stroke:color-mix(in srgb,var(--ink) 34%,transparent);stroke-width:.6}
.plate .planart .fix{fill:color-mix(in srgb,var(--ink) 12%,transparent);stroke:color-mix(in srgb,var(--ink) 30%,transparent);stroke-width:.45}
.plate .planart .desk{fill:none;stroke:color-mix(in srgb,var(--ink) 26%,transparent);stroke-width:.4}
.plate .planart .mull{stroke:color-mix(in srgb,var(--ink) 34%,transparent);stroke-width:.55}
.plate .planart text{fill:color-mix(in srgb,var(--ink) 55%,transparent);font-size:3.2px;font-family:"Instrument Sans",sans-serif;font-weight:500}
.heat{position:absolute;inset:0;filter:blur(2.2cqw);opacity:.82;mix-blend-mode:multiply}
.stage[data-theme="dark"] .heat{mix-blend-mode:screen;opacity:.66}
.hblob{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
.pins{position:absolute;inset:0}
.hpin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.3cqw}
.hpin .knob{
  width:1cqw;height:1cqw;border-radius:50%;background:var(--surface);
  border:.25cqw solid var(--ink);box-shadow:0 0 0 .28cqw color-mix(in srgb,var(--surface) 70%,transparent);
}
.hpin.unplaced .knob{border-style:dotted;opacity:.6}
.hpin .plab{
  font-size:1.1cqw;font-weight:600;white-space:nowrap;color:var(--ink);
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  border-radius:.3cqw;padding:.12cqw .45cqw;
}
.hpin .flag{font-size:.95cqw;font-weight:700;background:var(--ink);color:var(--paper);border-radius:.28cqw;padding:.08cqw .4cqw}
.mlegend{display:flex;align-items:center;gap:.8cqw;margin-top:.9cqw;font-size:1.1cqw;color:var(--muted);flex-wrap:wrap}
.mramp{width:8cqw;height:.5cqw;border-radius:99px;background:linear-gradient(90deg,var(--c-2),var(--c-1) 26%,var(--c0) 50%,var(--c1) 74%,var(--c2))}
.mswatch{width:2.2cqw;height:.5cqw;border-radius:99px;background:repeating-linear-gradient(45deg,var(--c-2) 0 .32cqw,var(--c2) .32cqw .64cqw)}
.mlegend .floor{margin-left:auto;font-weight:700;color:var(--ink)}
.reading{display:flex;flex-direction:column;gap:1.2cqw;margin-top:.4cqw}
.reading .r{font-size:1.4cqw;line-height:1.4;color:var(--muted)}
.reading .r b{color:var(--ink)}
.hmnote{
  margin-top:1.4cqw;font-size:1.2cqw;color:var(--muted);
  border:.1cqw dashed var(--line);border-radius:.8cqw;padding:.9cqw 1.1cqw;
}
.hmclose{font-size:1.5cqw;font-style:italic;color:var(--c0);margin-top:1.4cqw;line-height:1.4}

/* ---- 2x2 grid ---- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.8cqw;margin-top:1.4cqw}
.cell{background:var(--surface);border:.1cqw solid var(--line-soft);border-radius:1.2cqw;padding:1.8cqw}
.cell.accent{background:color-mix(in srgb,var(--c0) 12%,var(--surface));border:.17cqw solid var(--c0)}
.cell h3{margin-top:0}

/* ---- triage ---- */
.zrows{display:flex;flex-direction:column;gap:.75cqw}
.zrow{
  display:grid;grid-template-columns:1fr auto;gap:1cqw;align-items:center;
  background:var(--surface);border:.1cqw solid var(--line-soft);border-radius:.8cqw;padding:.85cqw 1.1cqw;
}
.zrow.top{background:var(--surface-2)}
.zname{display:flex;align-items:center;gap:.6cqw;font-size:1.5cqw;font-weight:700;color:var(--ink)}
.zflag{font-size:1cqw;font-weight:700;background:var(--ink);color:var(--paper);border-radius:99px;padding:.12cqw .6cqw}
.zmeta{font-size:1.2cqw;color:var(--muted);margin-top:.25cqw}
.zstrip{width:11cqw}
.zstrip .bands{height:2.6cqw;gap:.22cqw}
.zstrip .dot{width:.62cqw;height:.62cqw;gap:.18cqw}
.zstrip .band{gap:.18cqw;padding-bottom:.18cqw}
.zstrip .axis{height:.3cqw;margin-top:.3cqw}
.zstrip .needle{bottom:-.5cqw;height:1cqw;width:.2cqw}
.zquiet{font-size:1.15cqw;font-style:italic;color:var(--muted);width:11cqw;text-align:center}
.explain{display:flex;flex-direction:column;gap:1cqw}
.explain .e{font-size:1.3cqw;color:var(--muted);line-height:1.4}
.explain .e b{color:var(--ink)}
.statuscard{background:var(--surface-2);border:.1cqw solid var(--line-soft);border-radius:1cqw;padding:1.2cqw 1.3cqw;margin-top:1.4cqw}
.statuscard .lab{font-size:1.15cqw;color:var(--muted)}
.statussel{
  background:var(--surface);border:.1cqw solid var(--line);border-radius:.6cqw;
  padding:.55cqw .9cqw;font-size:1.3cqw;font-weight:700;color:var(--ink);margin:.55cqw 0;
}
.statusopts{font-size:1.05cqw;color:var(--muted)}
.badges{display:flex;gap:.6cqw;align-items:center;margin-top:.9cqw}
.badge{font-size:1cqw;font-weight:700;background:var(--ink);color:var(--paper);border-radius:99px;padding:.15cqw .7cqw}
.badges span.n{font-size:1.15cqw;font-style:italic;color:var(--muted)}

/* ---- deck chrome (hidden when presenting / rendering) ---- */
.controls{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.ctrl{font:inherit;font-weight:600;font-size:15px;cursor:pointer;background:#14242C;color:#fff;border:none;border-radius:9px;padding:9px 18px}
.ctrl.ghost{background:none;color:#14242C;border:1.5px solid #14242C}
.ctrl:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.counter{font-variant-numeric:tabular-nums;font-size:14px;color:#14242C}
.marks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mk{font:inherit;font-size:13px;cursor:pointer;background:rgba(255,255,255,.6);color:#14242C;border:1px solid rgba(20,36,44,.25);border-radius:99px;padding:4px 11px}
.mk.cur{background:#14242C;color:#fff;border-color:#14242C}
.note{color:#14242C;font-size:14px;margin-top:16px;line-height:1.6;opacity:.85}

body.presenting{overflow:hidden;background:#000}
body.presenting .shell{max-width:none;padding:0}
body.presenting .controls,body.presenting .marks,body.presenting .note{display:none}
body.presenting .stage{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;
  border-radius:0;box-shadow:none;
}
</style>
</head>
<body>
<div class="shell">
  <div class="stage" id="stage">
    <section class="scene" id="slide"></section>
  </div>

  <div class="controls">
    <button class="ctrl" id="prev">Prev</button>
    <button class="ctrl" id="next">Next</button>
    <button class="ctrl ghost" id="present">Present</button>
    <span class="counter" id="counter"></span>
  </div>
  <div class="marks" id="marks"></div>
  <p class="note">The deck, and the script. Each slide carries a <code>voiceover</code> line and a
    <code>duration</code> floor; <code>npm run build-video</code> screenshots every slide, narrates it
    with Kokoro, and crossfades the result into an MP4. See README.md.</p>
</div>

<script>
(function(){
  "use strict";
  var $=function(i){return document.getElementById(i);};
  function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}

  var SCALE=[
    {n:-2,f:"🥶",l:"Freezing",c:"--c-2"},
    {n:-1,f:"🧥",l:"Chilly",c:"--c-1"},
    {n: 0,f:"😌",l:"Just nice",c:"--c0"},
    {n: 1,f:"🫠",l:"Warm",c:"--c1"},
    {n: 2,f:"🥵",l:"Roasting",c:"--c2"}
  ];
  var HEAT=[[42,109,181],[95,163,196],[59,155,120],[222,144,54],[198,76,44]];

  /* The people the scenario follows. Each carries a temperature colour rather
     than a face: an invented person should not be given a gendered avatar, and
     the colour ties them to where they sit. */
  var CAST={
    priya:{name:"Priya",role:"L3 — window run",tint:"--c2"},
    daniel:{name:"Daniel",role:"L3 — shaded corner",tint:"--c-2"}
  };

  /* A plain profile silhouette, not a letter, so the avatar reads as "a person"
     rather than as a monogram. */
  var PERSON_ICON='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+
    '<path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v3h16v-3c0-2.76-3.58-5-8-5Z"/></svg>';

  /* Eleven votes: 3 freezing, 2 chilly, 1 just nice, 2 warm, 3 roasting. Mean
     exactly 0.0, one comfortable person, and it trips every condition of the
     split rule in src/app.html. */
  var SPLIT=[3,2,1,2,3];

  var MAP_AFTER=[
    {x:38,y:18,mean:.1,n:11,flag:"ADJUSTED"}
  ];

  /* A generic, spoiler-free glimpse of the heat map for the opening "what we
     built" slide — no flags, nothing that steals the L3 story. Two floors,
     read at a glance: one running hot, one running a little cold. */
  var TEASER_PINS=[
    {x:20,y:18,mean:2,n:8},   // top-left: roasting
    {x:20,y:78,mean:-1,n:6}   // bottom-left: chilly
  ];

  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function tally(counts){
    var n=0,sum=0;
    counts.forEach(function(c,i){n+=c;sum+=c*(i-2);});
    var cold=counts[0]+counts[1],hot=counts[3]+counts[4];
    return {n:n,mean:n?sum/n:0,cold:cold,hot:hot,nice:counts[2],
      split:n>=4&&Math.min(cold,hot)/n>=.25&&(cold+hot)/n>=.6};
  }
  function heatColor(mean){
    var p=clamp(mean,-2,2)+2,i=Math.min(3,Math.floor(p)),f=p-i;
    var a=HEAT[i],b=HEAT[i+1];
    return [0,1,2].map(function(k){return Math.round(a[k]+(b[k]-a[k])*f);});
  }
  function rgba(c,a){return "rgba("+c[0]+","+c[1]+","+c[2]+","+a+")";}
  function hblob(x,y,size,c,alpha){
    return '<div class="hblob" style="left:'+x+'%;top:'+y+'%;width:'+size+'%;aspect-ratio:1;'+
      'background:radial-gradient(circle,'+rgba(c,alpha)+' 0%,'+rgba(c,0)+' 70%)"></div>';
  }

        return '<rect class="desk" x="'+x+'" y="'+y+'" width="9" height="5" rx="1"/>'+
               '<rect class="desk" x="'+x+'" y="'+(y+5)+'" width="9" height="5" rx="1"/>';
      }).join("");
    }
    var m="";
    for(var x=12;x<=148;x+=8){
      m+='<line class="mull" x1="'+x+'" y1="4" x2="'+x+'" y2="7.5"/>';
      m+='<line class="mull" x1="'+x+'" y1="106" x2="'+x+'" y2="102.5"/>';
    }
    for(var y=14;y<=96;y+=8) m+='<line class="mull" x1="4" y1="'+y+'" x2="7.5" y2="'+y+'"/>';
    return '<svg class="planart" viewBox="0 0 160 110" preserveAspectRatio="none" aria-hidden="true">'+
      '<rect class="shellrect" x="4" y="4" width="152" height="102" rx="2"/>'+m+

  /* ---- shared pieces ------------------------------------------------- */

  function dotPlot(counts,opts){
    opts=opts||{};
    var t=tally(counts);
    var bands=SCALE.map(function(s,i){
      var dots="";
      for(var k=0;k<counts[i];k++) dots+='<span class="dot"></span>';
      return '<div class="band" style="--tint:var('+s.c+')">'+dots+'</div>';
    }).join("");
    var h='<div class="strip"><div class="bands">'+bands+'</div><div class="axis"></div>';
    if(t.n){
      var pct=clamp(((t.mean+2)/4)*100,2,98).toFixed(1);
      h+='<div class="needle'+((t.split&&!opts.solid)?" split":"")+'" style="left:'+pct+'%"></div>';
    }
    h+='</div>';
    if(opts.ticks!==false){
      h+='<div class="ticks">'+SCALE.map(function(s){return "<span>"+s.l+"</span>";}).join("")+'</div>';
    }
    return h;
  }

  function voteButtons(on){
    return '<div class="vbtns">'+SCALE.map(function(s,i){
      return '<div class="vbtn'+(i===on?" on":"")+'" style="--tint:var('+s.c+')">'+
        '<span class="f">'+s.f+'</span><span class="l">'+s.l+'</span></div>';
    }).join("")+'</div>';
  }

  function plate(pins){
    var H="",P="";
    pins.forEach(function(p){
      if(p.plain){ /* voting view: just the pin, no heat */ }
      else if(p.none) H+=hblob(p.x,p.y,17,[135,149,160],.35);
      else if(p.split){
        var coldX = p.splitReverse ? p.x+6 : p.x-6;
        var hotX  = p.splitReverse ? p.x-6 : p.x+6;
        H+=hblob(coldX,p.y,17,HEAT[0],.85);
        H+=hblob(hotX,p.y,17,HEAT[4],.85);
      }else{
        H+=hblob(p.x,p.y,15+Math.min(p.n,10)*.9,heatColor(p.mean),
          .5+Math.min(Math.abs(p.mean)/2,1)*.45);
      }
      P+='<div class="hpin'+(p.unplaced?" unplaced":"")+'" style="left:'+p.x+'%;top:'+p.y+'%">'+
        '<span class="knob"></span>'+
        (p.flag?'<span class="flag">'+esc(p.flag)+'</span>':'')+
        (p.label?'<span class="plab">'+esc(p.label)+'</span>':'')+'</div>';
    });
    return '<div class="plate">'+planSvg()+'<div class="heat">'+H+'</div>'+
      '<div class="pins">'+P+'</div></div>';
  }

  function head(d,plain){
    return (d.eyebrow?'<p class="eyebrow'+(plain?" plain":"")+'">'+esc(d.eyebrow)+'</p>':'')+

  }

            '<div class="badges">'+d.status.badges.map(function(b){
              return '<span class="badge">'+esc(b)+'</span>';
            }).join("")+'<span class="n">'+esc(d.status.note)+'</span></div>'+
          '</div>'+
        '</div>'+
      '</div></div>';
    }
  };

  var LAYOUT_CLASS={ title:"hero", duo:"duo" };

  var idx=0;
  function renderSlide(i){
    idx=clamp(i,0,SLIDES.length-1);
    var s=SLIDES[idx];
    var el=$("slide");
    $("stage").dataset.theme=s.theme;
    el.className="scene"+(LAYOUT_CLASS[s.layout]?" "+LAYOUT_CLASS[s.layout]:"");
    el.innerHTML=RENDER[s.layout](s.data)+'<span class="pageno">'+(idx+1)+'</span>';
    $("counter").textContent=(idx+1)+" / "+SLIDES.length;
    [].forEach.call($("marks").children,function(b,k){ b.classList.toggle("cur",k===idx); });
    document.body.dataset.ready="0";
    (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        document.body.dataset.ready="1";
      }); });
    });
  }

  $("marks").innerHTML=SLIDES.map(function(s,i){
    return '<button class="mk" data-i="'+i+'">'+esc(s.section)+'</button>';
  }).join("");
  [].forEach.call($("marks").children,function(b,i){
    b.addEventListener("click",function(){ renderSlide(i); });
  });
  $("prev").addEventListener("click",function(){ renderSlide(idx-1); });
  $("next").addEventListener("click",function(){ renderSlide(idx+1); });
  $("present").addEventListener("click",function(){
    document.body.classList.toggle("presenting");
    $("present").textContent=document.body.classList.contains("presenting")?"Exit":"Present";
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight") renderSlide(idx+1);
    else if(e.key==="ArrowLeft") renderSlide(idx-1);
    else if(e.key==="Escape"){ document.body.classList.remove("presenting"); $("present").textContent="Present"; }
  });

  /* Build contract: window.SLIDES for content and timings,
     window.__renderSlide(i) to paint a slide before screenshotting it. */
  window.SLIDES=SLIDES;
  window.__renderSlide=renderSlide;

  renderSlide(0);
})();
</script>
</body>
</html>
